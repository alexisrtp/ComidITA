<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto | ComidITA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-admin: #F8F9FA;
            --brand-light: #FFF3EB;
            --white: #FFFFFF;
            --text-dark: #1E2A38;
            --text-muted: #8C98A4;
            --accent-red: #E24A29;
            --sidebar-width: 260px;
        }

        body, html {
            margin: 0; padding: 0; background-color: var(--bg-admin);
            font-family: 'Poppins', sans-serif; color: var(--text-dark);
            min-height: 100vh; display: flex;
        }

        /* --- MENÚ LATERAL (Se mantiene para consistencia de UX) --- */
        .left-sidebar {
            position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh;
            background: var(--white); box-shadow: 5px 0 30px rgba(0, 0, 0, 0.03);
            padding: 40px 20px; display: flex; flex-direction: column; box-sizing: border-box;
            z-index: 100; border-right: 1px solid #EAEAEA;
        }

        .brand-section { text-align: center; margin-bottom: 40px; }
        .brand-section h2 { margin: 0; font-size: 22px; color: var(--accent-red); font-weight: 700; }
        .brand-section p { margin: 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .menu-links { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; border-radius: 12px; color: var(--text-muted);
            text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.2s;
        }
        .menu-item-content { display: flex; align-items: center; gap: 12px; }
        .menu-item svg { width: 20px; height: 20px; stroke: currentColor; }
        .menu-item.active { background-color: var(--brand-light); color: var(--accent-red); font-weight: 600; }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            flex-grow: 1; margin-left: var(--sidebar-width);
            padding: 40px 5%; display: flex; justify-content: center; align-items: flex-start;
        }

        /* Tarjeta del Formulario */
        .form-card {
            background: var(--white); border-radius: 25px; padding: 40px; width: 100%; max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #F0F0F0; margin-top: 20px;
        }

        .form-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #EAEAEA; }
        .back-btn {
            background: #F4F4F4; width: 40px; height: 40px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; color: var(--text-dark);
            text-decoration: none; transition: all 0.2s;
        }
        .back-btn:hover { background: var(--brand-light); color: var(--accent-red); transform: translateX(-3px); }
        .form-header h1 { margin: 0; font-size: 22px; font-weight: 700; }

        /* Magia CSS para estilizar el {{ form.as_p }} de Django automáticamente */
        .django-form p { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .django-form label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .django-form input[type="text"],
        .django-form input[type="number"],
        .django-form input[type="file"],
        .django-form textarea,
        .django-form select {
            padding: 14px 20px; border: 1px solid #EAEAEA; border-radius: 15px;
            font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--text-dark);
            background-color: #FAFAFA; transition: all 0.3s ease; outline: none; width: 100%; box-sizing: border-box;
        }

        .django-form input:focus, .django-form textarea:focus, .django-form select:focus {
            border-color: var(--accent-red); background-color: var(--white); box-shadow: 0 0 0 4px rgba(226, 74, 41, 0.1);
        }

        .django-form textarea { resize: vertical; min-height: 100px; }

        /* Checkboxes (si el producto es vegano, picante, etc) */
        .django-form input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-red); cursor: pointer; }
        .django-form p:has(input[type="checkbox"]) { flex-direction: row; align-items: center; gap: 15px; }
        .django-form p:has(input[type="checkbox"]) label { margin: 0; padding-top: 2px; }

        /* Botones de Acción */
        .form-actions { display: flex; gap: 15px; margin-top: 35px; justify-content: flex-end; }

        .btn-cancel {
            padding: 14px 25px; border-radius: 15px; font-weight: 600; font-size: 14px;
            color: var(--text-muted); text-decoration: none; background: transparent; transition: all 0.2s;
        }
        .btn-cancel:hover { background: #F4F4F4; color: var(--text-dark); }

        .btn-submit {
            background-color: var(--accent-red); color: var(--white); border: none;
            padding: 14px 30px; border-radius: 15px; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(226, 74, 41, 0.2); }
    </style>
</head>
<body>

    <!-- MENÚ LATERAL -->
    <nav class="left-sidebar">
        <div class="brand-section">
            <h2>ComidITA</h2>
            <p>Panel de Vendedor</p>
        </div>

        <div class="menu-links">
            <!-- Redirigimos al panel principal -->
            <a href="{% url 'panel_emprendedor' %}" class="menu-item active">
                <div class="menu-item-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Mi Menú
                </div>
            </a>
            <a href="{% url 'panel_emprendedor' %}" class="menu-item">
                <div class="menu-item-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Pedidos
                </div>
            </a>
        </div>
    </nav>

    <!-- ÁREA DEL FORMULARIO -->
    <main class="main-content">
        <div class="form-card">

            <div class="form-header">
                <a href="{% url 'panel_emprendedor' %}" class="back-btn" title="Volver al panel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h1>Agregar Nuevo Platillo</h1>
            </div>

            <!-- ¡IMPORTANTE!: enctype permite la subida de imágenes si tu modelo las tiene -->
            <form method="POST" enctype="multipart/form-data" class="django-form">
                {% csrf_token %}

                <!-- Django inyecta los campos, y nuestro CSS ".django-form" los estiliza automáticamente -->
                {{ form.as_p }}

                <div class="form-actions">
                    <a href="{% url 'panel_emprendedor' %}" class="btn-cancel">Cancelar</a>
                    <button type="submit" class="btn-submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Guardar Platillo
                    </button>
                </div>
            </form>

        </div>
    </main>

</body>
</html>
