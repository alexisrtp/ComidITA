<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComidITA | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de colores acordada */
            --brand-light: #fcf4e8; /* Naranja/Crema muy claro para acentos */
            --bg-main: #FDFCF7; /* Fondo principal crema */
            --white: #FFFFFF;
            --text-dark: #1E2A38; /* Azul Marino Profundo para textos */
            --text-muted: #666666;
            --accent-red: #E24A29; /* Rojo Pepperoni para botones */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            /* Fondo dividido: 35% Crema claro, 65% Fondo Principal */
            background: linear-gradient(to right, var(--brand-light) 0%, var(--brand-light) 35%, var(--bg-main) 35%, var(--bg-main) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cards-wrapper {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        /* Estilo base para ambas tarjetas */
        .mobile-card {
            width: 320px;
            height: 650px;
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* --- TARJETA IZQUIERDA --- */
        .card-left {
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-sizing: border-box;
            z-index: 2;
        }

        .brand-header {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 40px;
            line-height: 1.3;
            text-align: center;
        }

        /* Contenedor estricto para que la imagen NO rompa el diseño */
        .image-container {
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 60px;
            position: relative;
        }

        .main-logo {
            width: 250px;
            height: 250px;
            object-fit: contain;
            mix-blend-mode: multiply; /* Fusiona el fondo blanco del JPG */
        }

        /* Círculo decorativo naranja */
        .circle-bg {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: var(--brand-light);
            border-radius: 50%;
            z-index: -1;
        }

        .left-footer {
            margin-top: auto;
        }

        .left-footer h3 {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }

        .left-footer p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Círculo interior para la tarjeta izquierda */
        .inner-circle {
            position: absolute;
            right: 30px;
            bottom: 40px;
            width: 50px;
            height: 50px;
            background-color: var(--accent-red);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
        }

        /* --- TARJETA DERECHA --- */
        .card-right {
            background-color: var(--bg-main);
            transform: translateY(60px); /* El desplazamiento hacia abajo */
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            background-color: var(--brand-light);
            padding: 50px 30px 0 30px;
            position: relative;
            flex-grow: 1;
            z-index: 2;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }

        .login-header p {
            font-size: 13px;
            font-weight: 500;
            margin: 0;
            color: var(--text-dark);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-dark);
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            outline: none;
            transition: box-shadow 0.2s;
            background-color: var(--white);
        }

        .input-group input:focus {
            box-shadow: 0 0 0 2px rgba(30, 42, 56, 0.2);
        }

        .submit-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            margin-bottom: -30px;
            position: relative;
            z-index: 10;
        }

        .btn-submit {
            background-color: var(--accent-red);
            color: var(--white);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(226, 74, 41, 0.3);
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.05);
        }

        /* Borde curvo decorativo (Brochazo) */
        .brush-edge {
            width: 100%;
            height: auto;
            display: block;
            margin-top: -5px;
            position: relative;
            z-index: 1;
        }

        .bottom-section {
            background-color: var(--white);
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        .terms {
            font-size: 11px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .register-link {
            color: var(--accent-red);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--accent-red);
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="cards-wrapper">

        <!-- TARJETA IZQUIERDA -->
        <div class="mobile-card card-left">
            <div class="brand-header">
                Mueve tu negocio<br>en el Instituto
            </div>

            <!-- Contenedor de la Imagen Seguro -->
            <div class="image-container">

                <img src="{% static 'logo1.png' %}"  class="main-logo">
            </div>

            <div class="left-footer">
                <h3>ComidITA</h3>
                <p>La red de emprendedores</p>
            </div>

            <!-- Botón círculo izquierdo -->
            <div class="inner-circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
        </div>

        <!-- TARJETA DERECHA -->
        <div class="mobile-card card-right">

            <div class="top-section">
                <!-- AQUÍ ESTABA EL ERROR: El div de login-header debe cerrarse ANTES del formulario -->
                <div class="login-header">
                    <h2>Inicio de Sesión</h2>
                    <p>Accede para continuar</p>
                </div> <!-- ¡Este cierre es vital para que no se deforme! -->
                {% if messages %}
                    {% for message in messages %}
                        <div style="color: var(--accent-red); font-size: 12px; font-weight: 600; margin-top: 10px; margin-bottom: 15px;">
                                {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="input-group">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="email" name="username" placeholder="Correo institucional" required autofocus>
                    </div>

                    <div class="input-group">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                        <input type="password" name="password" placeholder="Contraseña segura" required>
                    </div>

                    <div class="submit-container">
                        <button type="submit" class="btn-submit">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </form>
            </div>

            <svg class="brush-edge" viewBox="0 0 100 15" preserveAspectRatio="none">
                <path d="M0,0 L100,0 L100,2 C80,12 65,1 50,8 C35,15 20,4 0,10 Z" fill="#fcf4e8" />
                <path d="M0,5 C15,-2 30,12 45,5 C60,-2 75,10 100,3 L100,10 C75,15 60,3 45,10 C30,17 15,3 0,10 Z" fill="#fcf4e8" opacity="0.7"/>
            </svg>

            <div class="bottom-section">
                <div class="terms">
                    <a href="{% url 'registro' %}" class="register-link">¡Regístrate!</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
